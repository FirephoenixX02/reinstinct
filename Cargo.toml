[workspace]
resolver = "3"
members = [
    "crates/hip",
    "crates/gguf",
    "crates/sampling",
    "crates/quant",
    "crates/model",
    "crates/tokenizer",
    "crates/chat",
    "crates/cpu",
    "crates/runtime",
    "crates/serve",
    "engine",
]

[workspace.dependencies]
bytemuck = { version = "1.20", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
memmap2 = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rayon = "1.10"
half = "2.4"
fancy-regex = "0.14"
serde_json = "1.0"

[profile.release]
opt-level = 3
codegen-units = 16
debug = "line-tables-only"

# Binary crate: single codegen unit for maximum optimization.
[profile.release.package."reinstinct-engine"]
codegen-units = 1

[profile.dev]
opt-level = 1
